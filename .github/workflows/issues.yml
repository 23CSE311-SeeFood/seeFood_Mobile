name: CodeRabbit Cleanup
on:
  pull_request:
    branches: [ main ]
jobs:
  track_unresolved:
    # Only runs if the PR was actually merged, not just closed
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Notify CodeRabbit to sync issues
        run: |
          curl -X POST https://api.coderabbit.ai/webhooks/sync \
          -H "Authorization: Bearer ${{ secrets.CODERABBIT }}" \
          -H "Content-Type: application/json" \
          -d '{"pr_number": "${{ github.event.pull_request.number }}", "repo": "${{ github.repository }}"}'